<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้สอน - CINAHL</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), app=document.getElementById('app'), $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9ก-๙]+/g,'');
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let st={status:'waiting',round:1},subs={},marks={},subRef=null,lastRound=null;
const K=JSON.parse(localStorage.getItem('cg_host')||'{}'); // โจทย์และเฉลยเก็บในเครื่องผู้สอนเท่านั้น
const DEF={q1:'ใช้ Advanced search ค้นคำว่า Nursing Care\nเลือก Filter:\n- Full Text, Peer Reviewed\n- ภาษา: English\n- เรียงผลลัพธ์ให้ใหม่ล่าสุดก่อน\nแล้วคัดลอกชื่อบทความรายการแรกมาวาง',
 k1:'Acute Motor and Sensory Axonal Neuropathy Variant of Guillain-Barré Syndrome: A Nurse-Led Intensive Care Case Report',
 mc:[{q:'ค้นคำว่า Pressure Ulcer Prevention\nเลือก Filter:\n- Full Text, Peer Reviewed\n- ปี 2023-2026\n- ภาษา English\nชื่อผู้แต่งของรายการแรกคือข้อใด',correct:'Hani, Salam Bani;Habashneh, Sakhaa S.;Al-Katatbh, Hamza Yaseen',w:['Alharbi, Fahad M.;Al-Rashidi, Noura S.;Khalil, Omar A.','Chen, Li Wei;Tanaka, Mei;Park, Soo-Jin','Santos, Maria L.;Oliveira, Pedro H.;Costa, Ana B.']},
 {q:'วารสารชื่อ National Nurse ฉบับล่าสุดอยู่ที่ Volume และ Issue เท่าไหร่',correct:'Vol. 122 Issue 3',w:['Vol. 121 Issue 3','Vol. 122 Issue 1','Vol. 123 Issue 2']},
 {q:'ใน CINAHL Headings เมื่อพิมพ์คำว่า "Cancer" ระบบจะแนะนำคำว่าอะไร',correct:'Neoplasms',w:['Malignant Disease','Tumor Markers','Oncology Patients']}]};
if(K.v!==2){for(const k in K)delete K[k];K.v=2;}
const D=Object.assign({},DEF,K);if(!K.mc)D.mc=DEF.mc;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
if(sessionStorage.getItem('cg_ok')!=='1'){
  app.innerHTML=`<div class="card"><h2>🔒 หน้าผู้สอน</h2><input id="pw" type="password" placeholder="รหัสผ่าน"><p><button id="in">เข้า</button></p></div>`;
  $('#in').onclick=()=>{if($('#pw').value===HOST_PASSCODE){sessionStorage.setItem('cg_ok','1');build();}else alert('รหัสไม่ถูกต้อง');};
}else build();
function build(){
  const mcHtml=D.mc.map((m,i)=>`<hr><label class="mu">โจทย์ข้อ ${i+2} (ตัวเลือก)</label><textarea id="mq${i}">${esc(m.q)}</textarea>
  <label class="mu">✅ ตัวเลือกที่ถูก</label><input id="mc${i}" class="sec" type="password" autocomplete="off" value="${esc(m.correct)}">
  <label class="mu">❌ ตัวเลือกที่ผิด 3 ข้อ</label>${[0,1,2].map(j=>`<input id="mw${i}_${j}" class="sec" type="password" autocomplete="off" value="${esc(m.w[j]||'')}" style="margin-bottom:6px">`).join('')}`).join('');
  app.innerHTML=`<h1>🧑‍🏫 แดชบอร์ดผู้สอน</h1>
  <details class="card" id="setup"><summary style="cursor:pointer"><b>⚙️ ตั้งโจทย์และเฉลย</b> <span class="mu">(กดเพื่อเปิด/ปิด)</span></summary>
  <label class="mu">โจทย์ข้อ 1 (แบบกรอก)</label><textarea id="q1" style="min-height:140px"></textarea>
  <label class="mu">เฉลยข้อ 1 (ชื่อบทความ)</label><input id="k1" class="sec" type="password" autocomplete="off">
  ${mcHtml}
  <p class="mu">เฉลยและตัวเลือกที่ผิดแสดงเป็นจุด และเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ระบบจะสลับลำดับตัวเลือกให้นักศึกษาแต่ละคนอัตโนมัติ</p>
  <p class="row"><button class="sec" id="save">บันทึกโจทย์/เฉลย</button><button class="sec" id="peek">👁 แสดงเฉลย</button></p></details>
  <div class="card c"><h2>สถานะ: <span id="lab"></span></h2>
  <p class="mu">เข้าห้องแล้ว <span id="rdy">0</span> คน · ส่งแล้ว <span id="cnt">0</span> คน</p>
  <div class="row"><button id="start">▶ เริ่มพร้อมกัน</button><button class="sec" id="end">■ ปิดรับคำตอบ</button><button class="sec" id="next">↻ รีเซ็ต (ล้างผล)</button></div></div>
  <div class="card"><h2>ผลการตอบ (เรียงตามคะแนน แล้วตามเวลา) <button class="sec" id="hide" style="font-size:.8rem;padding:4px 10px">🙈 ซ่อนตาราง</button></h2><div id="res">
  <p class="mu">ตรวจอัตโนมัติ: ข้อ 1 ดูว่าคำตอบมีชื่อบทความตามเฉลยอยู่หรือไม่ (ไม่สนตัวพิมพ์/เครื่องหมาย) ข้อ 2-4 เทียบกับตัวเลือกที่ถูก แตะ ✓/✗ เพื่อแก้เอง</p>
  <div class="tblw"><table><thead><tr><th>#</th><th>ชื่อ</th><th>เวลา</th><th>ข้อ1</th><th>ข้อ2</th><th>ข้อ3</th><th>ข้อ4</th><th>คะแนน</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>`;
  $('#q1').value=D.q1;$('#k1').value=D.k1;
  const save=()=>{K.q1=$('#q1').value;K.k1=$('#k1').value;
    K.mc=D.mc.map((_,i)=>({q:$('#mq'+i).value,correct:$('#mc'+i).value.trim(),w:[0,1,2].map(j=>$('#mw'+i+'_'+j).value.trim()).filter(Boolean)}));
    localStorage.setItem('cg_host',JSON.stringify(K));renderTable();};
  $('#save').onclick=()=>{save();$('#setup').open=false;pw(false);};
  const pw=h=>{document.querySelectorAll('#setup input.sec,#k1').forEach(e=>e.type=h?'text':'password');$('#peek').textContent=h?'🙈 ซ่อนเฉลย':'👁 แสดงเฉลย';};
  $('#peek').onclick=()=>pw($('#k1').type==='password');
  $('#hide').onclick=()=>{const r=$('#res');const h=r.style.display!=='none';r.style.display=h?'none':'';$('#hide').textContent=h?'👁 แสดงตาราง':'🙈 ซ่อนตาราง';};
  $('#setup').open=!K.mc;
  $('#start').onclick=()=>{save();
    if(K.mc.some(m=>!m.correct||m.w.length<1))return alert('ข้อ 2-4 ต้องมีตัวเลือกที่ถูกและตัวเลือกที่ผิดอย่างน้อย 1 ข้อ');
    db.ref('game/state').update({status:'running',round:st.round||1,q1:K.q1,qs:K.mc.map(m=>({q:m.q,opts:shuf([m.correct,...m.w])})),startedAt:firebase.database.ServerValue.TIMESTAMP});};
  $('#end').onclick=()=>db.ref('game/state').update({status:'ended'});
  $('#next').onclick=()=>{if(confirm('รีเซ็ตเกม? ผลที่ส่งมาแล้วจะถูกซ่อน'))db.ref('game/state').update({status:'waiting',round:(st.round||1)+1,startedAt:null});};
  db.ref('game/state').on('value',s=>{st=s.val()||{status:'waiting',round:1};
    $('#lab').textContent={waiting:'รอเริ่ม',running:'กำลังแข่ง',ended:'จบรอบ'}[st.status]||'';
    $('#start').disabled=st.status==='running';$('#end').disabled=st.status!=='running';
    if(st.round!==lastRound){lastRound=st.round;subs={};if(subRef)subRef.off();
      subRef=db.ref('subs/'+st.round);subRef.on('value',x=>{subs=x.val()||{};renderTable();});}
    renderTable();});
}
const ok1=(a,k)=>!!norm(k)&&norm(a).includes(norm(k));
const okN=(a,k)=>!!norm(k)&&norm(a)===norm(k);
function renderTable(){
  const tb=$('#tb');if(!tb)return;
  const mc=(K.mc||D.mc), k1=K.k1??D.k1;
  const all=Object.entries(subs).map(([id,s])=>({id,...s}));
  $('#rdy').textContent=all.length;
  const rows=all.filter(s=>s.t).map(s=>{
    const m=[ok1(s.a1,k1),okN(s.a2,mc[0]?.correct),okN(s.a3,mc[1]?.correct),okN(s.a4,mc[2]?.correct)].map((v,i)=>marks[s.id+i]??v);
    return{...s,m,score:m.filter(Boolean).length,el:s.t-(st.startedAt||s.t)};
  }).sort((a,b)=>b.score-a.score||a.el-b.el);
  $('#cnt').textContent=rows.length;
  const cell=(r,i,txt)=>`<td><span class="mk ${r.m[i]?'ok':'no'}" data-k="${r.id}${i}" data-v="${r.m[i]}">${r.m[i]?'✓':'✗'}</span><div class="ans">${esc(txt)}</div></td>`;
  tb.innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${i+1}${i===0&&r.score>0?' 🏆':''}</td><td>${esc(r.name)}</td><td>${fmt(r.el)}</td>${cell(r,0,r.a1)}${cell(r,1,r.a2)}${cell(r,2,r.a3)}${cell(r,3,r.a4)}<td><b>${r.score}/4</b></td></tr>`).join(''):'<tr><td colspan="8" class="mu">ยังไม่มีคนส่ง</td></tr>';
  tb.querySelectorAll('.mk').forEach(e=>e.onclick=()=>{marks[e.dataset.k]=e.dataset.v!=='true';renderTable();});
}
</script></body></html>
