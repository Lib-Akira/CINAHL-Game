<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภารกิจนักสืบ CINAHL</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), app=document.getElementById('app'), $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let uid=localStorage.getItem('cg_uid');if(!uid){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('cg_uid',uid);}
function shuf(arr,seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  const r=()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296};
  const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let name=localStorage.getItem('cg_name')||'', st={status:'waiting',round:1}, mine=null, offset=0, tick=null, subRef=null, lastRound=null;
db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
db.ref('game/state').on('value',s=>{st=s.val()||{status:'waiting',round:1};
  if(st.round!==lastRound){lastRound=st.round;mine=null;if(subRef)subRef.off();
    subRef=db.ref(`subs/${st.round}/${uid}`);subRef.on('value',x=>{mine=x.val();render();});
    if(name)subRef.update({name,ready:true});}
  render();});
function render(){
  clearInterval(tick);
  if(!name){
    app.innerHTML=`<h1>🔎 ภารกิจนักสืบ CINAHL</h1><div class="card"><h2>กรอกชื่อ-สกุล</h2>
    <div class="row"><input id="fn" placeholder="ชื่อ"><input id="ln" placeholder="สกุล"></div><p><button id="go">เข้าร่วม</button></p></div>`;
    $('#go').onclick=()=>{const f=$('#fn').value.trim(),l=$('#ln').value.trim();if(!f||!l)return alert('กรุณากรอกทั้งชื่อและสกุล');
      name=f+' '+l;localStorage.setItem('cg_name',name);if(subRef)subRef.update({name,ready:true});render();};
    return;}
  if(mine&&mine.t){
    app.innerHTML=`<div class="card c"><div class="big">✅</div><h2>ส่งคำตอบแล้ว</h2><p>ใช้เวลา ${st.startedAt?fmt(mine.t-st.startedAt):'-'} นาที<br><span class="mu">รอผู้สอนประกาศผล</span></p></div>`;return;}
  if(st.status==='running'){
    const dk='cg_d_'+st.round, D=JSON.parse(localStorage.getItem(dk)||'{}'), qs=st.qs||[];
    const mc=qs.map((q,i)=>`<div class="card"><h2>ข้อ ${i+2}</h2><div class="q">${esc(q.q)}</div>`+
      shuf(q.opts||[],uid+i).map(o=>`<label style="display:block;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;cursor:pointer"><input type="radio" name="m${i}" value="${esc(o)}" style="width:auto;margin-right:8px" ${D['m'+i]===o?'checked':''}>${esc(o)}</label>`).join('')+`</div>`).join('');
    app.innerHTML=`<h1>🔎 เริ่ม!</h1><p class="mu">${esc(name)} · เวลา <b id="clk">0:00</b></p>
    <div class="card"><h2>ข้อ 1</h2><div class="q">${esc(st.q1)}</div><textarea id="a1" placeholder="วางผลการสืบค้นที่นี่">${esc(D.a1||'')}</textarea></div>${mc}
    <p><button id="send" style="width:100%">ส่งคำตอบ</button></p>`;
    const save=()=>{const d={a1:$('#a1').value};qs.forEach((_,i)=>{const r=document.querySelector(`input[name=m${i}]:checked`);if(r)d['m'+i]=r.value;});localStorage.setItem(dk,JSON.stringify(d));return d;};
    $('#a1').oninput=save;app.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=save);
    tick=setInterval(()=>{const c=$('#clk');if(c)c.textContent=fmt(Date.now()+offset-st.startedAt);},1000);
    $('#send').onclick=async()=>{const d=save();
      const blank=!d.a1.trim()||qs.some((_,i)=>!d['m'+i]);
      if(blank&&!confirm('ยังตอบไม่ครบทุกข้อ ส่งเลยไหม?'))return;
      $('#send').disabled=true;
      const o={name,ready:true,a1:d.a1.trim(),t:firebase.database.ServerValue.TIMESTAMP};qs.forEach((_,i)=>o['a'+(i+2)]=d['m'+i]||'');
      try{await subRef.set(o);localStorage.removeItem(dk);}
      catch(e){alert('ส่งไม่สำเร็จ ลองกดอีกครั้ง');$('#send').disabled=false;}};
    return;}
  if(st.status==='ended'){app.innerHTML=`<div class="card c"><h2>หมดเวลาแล้ว</h2></div>`;return;}
  app.innerHTML=`<h1>🔎 ภารกิจนักสืบ CINAHL</h1><div class="card c"><h2>สวัสดี ${esc(name)}</h2><div class="big">⏳</div><p>รอผู้สอนกดเริ่ม...<br><span class="mu">เปิดฐานข้อมูล CINAHL เตรียมไว้ได้เลย</span></p><p><button class="sec" id="rename">✏️ แก้ชื่อ</button></p></div>`;
  $('#rename').onclick=()=>{name='';localStorage.removeItem('cg_name');render();};
}
render();
</script></body></html>
